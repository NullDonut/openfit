name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired SDK package `tools`, which sdkmanager rejects.
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      # Action logs need repository admin rights, but check-run annotations are readable for a
      # public repository. Surface the Gradle error there so a failing build can be diagnosed.
      - name: Report build failure
        if: failure()
        run: |
          echo "--- Gradle failure summary ---"
          grep -nE "What went wrong|FAILURE:|error:|^e: |Caused by:|Execution failed|> Task .* FAILED|Could not (resolve|download|find)|Unsupported class file|requires .*compile|Cannot access|Unresolved reference" build.log | tail -40 || true
          echo "--- Last log lines ---"
          tail -c 3000 build.log || true
          { grep -hE "What went wrong|FAILURE:|error:|^e: |Caused by:|Execution failed|> Task .* FAILED|Could not (resolve|download|find)|requires .*compile|Cannot access|Unresolved reference" build.log | tail -20 || true
            echo "---"
            tail -c 1500 build.log || true
          } | sed 's/\r$//; s/%/%25/g' | awk '{print "::error::" $0}'

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: openfit-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download test APK
        uses: actions/download-artifact@v4
        with:
          name: openfit-debug-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/app-debug.apk
          fail_on_unmatched_files: true
