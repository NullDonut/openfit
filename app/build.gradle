plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.openfit.app'
    compileSdk 35

    // A committed test keystore, so every CI build has the same signature. Without it each
    // ubuntu-latest runner generates a fresh debug key, Android refuses to install over the
    // previous APK, and the uninstall wipes the saved watch binding.
    //
    // This key is public on purpose and is for test builds only. Before any real distribution,
    // replace it with a private release keystore; that switch needs one uninstall.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.openfit.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { compose true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions { jvmTarget = '11' }

    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    // zxing-android-embedded 4.3.0 references AndroidX core and fragment from its bytecode but
    // does not declare them in its published POM. Without these the QR activity crashes with
    // NoClassDefFoundError (androidx.core.content.ContextCompat / androidx.fragment.app.Fragment).
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    // ComponentActivity installs the ViewTreeLifecycleOwner that ComposeView requires. Fragment
    // already pulls this in, but pinning it keeps the Compose host independent of that chain.
    implementation 'androidx.activity:activity:1.9.3'

    // Compose Material 3. The 2025.10.01 BOM pins material3 1.4.0 and Compose 1.9.4. The true
    // Material 3 Expressive theme/components are still internal in 1.4.0 and only became public in
    // 1.5.0, which requires compileSdk 37 and AGP 9.1; this is the newest combination that fits
    // compileSdk 35 / AGP 8.6.1, so the expressive look is built from stable APIs instead.
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'

    testImplementation 'junit:junit:4.13.2'
}

// The fragment dependency chain drags in Kotlin 1.6-era kotlin-stdlib-jdk7/-jdk8 shims next to
// kotlin-stdlib 1.8.22. Both define kotlin.collections.jdk8.CollectionsJDK8Kt, which fails
// :app:checkDebugDuplicateClasses. The JDK7/JDK8 classes were folded into kotlin-stdlib in
// Kotlin 1.8, so the old shim artifacts can be excluded rather than version-aligned.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
